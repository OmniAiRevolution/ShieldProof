<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050814">
  <title>SHIELDPROOF v7.5.3 — AI Trap &amp; Proof Shield</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #050814; --surface: rgba(14, 21, 43, 0.86); --surface-2: rgba(23, 33, 66, 0.9);
      --primary: #3b82f6; --cyan: #22d3ee; --ok: #34d399; --warn: #fbbf24; --err: #fb7185;
      --text: #f8fafc; --muted: #94a3b8; --border: rgba(56, 189, 248, 0.16);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); user-select: none; }
    input, textarea { user-select: text; }
    body { padding-bottom: calc(92px + env(safe-area-inset-bottom)); position: relative; }
    .cyber-bg {
      position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
      background-image: linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.32; animation: floatOrb 9s ease-in-out infinite alternate; }
    .orb-1 { width: 240px; height: 240px; background: #2563eb; top: -60px; left: -60px; }
    .orb-2 { width: 220px; height: 220px; background: #06b6d4; bottom: 80px; right: -70px; animation-delay: -4s; }
    @keyframes floatOrb { 0% { transform: translate3d(0,0,0) scale(1); } 100% { transform: translate3d(24px,32px,0) scale(1.12); } }
    header {
      position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 12px 14px; background: rgba(5,8,20,0.88); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 18px; font-weight: 900; letter-spacing: 0.5px; }
    .logo span { color: var(--cyan); text-shadow: 0 0 14px rgba(34,211,238,0.45); }
    .sub { font-size: 10px; color: var(--ok); margin-top: 2px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulseDot 1.6s infinite; flex-shrink: 0; }
    @keyframes pulseDot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.75); } }
    .lang-bar { display: flex; gap: 4px; flex-shrink: 0; }
    .lang-pill {
      background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
      padding: 6px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .lang-pill:active { transform: scale(0.92); }
    .lang-pill.active { background: var(--primary); color: #fff; border-color: var(--cyan); box-shadow: 0 0 12px rgba(59,130,246,0.4); }
    main { padding: 14px; max-width: 640px; margin: 0 auto; }
    .anim { animation: fadeUp 0.25s var(--ease); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .card {
      background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--border);
      border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .hero-scan {
      position: relative; overflow: hidden; display: block; text-align: center; padding: 26px 16px; border-radius: 20px;
      border: 1.5px solid rgba(34,211,238,0.38);
      background: radial-gradient(circle at 50% 25%, rgba(34,211,238,0.14), rgba(10,16,36,0.92)); cursor: pointer;
    }
    .hero-scan:active { transform: scale(0.97); }
    .hero-scan input { display: none; }
    .scan-laser {
      position: absolute; left: 0; right: 0; height: 2px; top: 0;
      background: linear-gradient(90deg, transparent, var(--cyan), #fff, var(--cyan), transparent);
      box-shadow: 0 0 14px 2px rgba(34,211,238,0.55); opacity: 0.65; pointer-events: none; animation: laserSweep 3.4s ease-in-out infinite;
    }
    @keyframes laserSweep { 0% { transform: translateY(8px); opacity: 0; } 15%,85% { opacity: 0.8; } 100% { transform: translateY(200px); opacity: 0; } }
    .radar-wrap { position: relative; width: 74px; height: 74px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; }
    .radar-ring { position: absolute; inset: 0; border-radius: 22px; border: 1.5px solid rgba(34,211,238,0.55); animation: radarPulse 2.4s var(--ease) infinite; }
    .radar-ring-2 { animation-delay: 1.2s; }
    @keyframes radarPulse { 0% { transform: scale(0.85); opacity: 0.85; } 100% { transform: scale(1.45); opacity: 0; } }
    .scan-icon {
      position: relative; z-index: 2; width: 56px; height: 56px; border-radius: 18px;
      background: linear-gradient(135deg, #2563eb, #06b6d4); color: #fff; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 22px rgba(34,211,238,0.45);
    }
    .hud-grid, .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .hud-card, .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 13px; position: relative; overflow: hidden; }
    .hud-card::after {
      content: ""; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(34,211,238,0.07), transparent); animation: shimmer 4.5s infinite;
    }
    @keyframes shimmer { 0% { left: -100%; } 45%,100% { left: 160%; } }
    .hud-val, .stat-val { font-size: 20px; font-weight: 800; margin-top: 4px; color: #fff; }
    .plan-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 11px 14px; border-radius: 14px;
      margin-bottom: 12px; background: linear-gradient(135deg, rgba(59,130,246,0.16), rgba(34,211,238,0.09));
      border: 1px solid rgba(34,211,238,0.35); cursor: pointer;
    }
    .pack-card { border: 1px solid var(--border); border-radius: 14px; padding: 14px; background: var(--surface-2); margin-bottom: 10px; }
    .pack-card.featured { border-color: var(--cyan); box-shadow: 0 0 18px rgba(34,211,238,0.16); }
    .pack-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
    .pack-price { color: var(--ok); font-size: 16px; white-space: nowrap; }
    .ai-modules { display: flex; flex-direction: column; gap: 8px; }
    .ai-mod {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px; cursor: pointer;
    }
    .ai-mod:active { transform: scale(0.98); border-color: var(--cyan); }
    .mod-icon {
      width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(59,130,246,0.16); color: var(--cyan); border: 1px solid rgba(34,211,238,0.28);
    }
    .mod-title { font-size: 13px; font-weight: 700; }
    .mod-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .faq-section { margin-top: 18px; }
    .faq-heading { font-size: 14px; font-weight: 800; color: var(--cyan); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    details.faq-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 8px; overflow: hidden; }
    details.faq-item[open] { border-color: rgba(34,211,238,0.45); }
    summary.faq-q { list-style: none; padding: 13px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; }
    summary.faq-q::-webkit-details-marker { display: none; }
    .faq-num { font-size: 10px; font-weight: 800; color: var(--cyan); background: rgba(34,211,238,0.14); border: 1px solid rgba(34,211,238,0.35); padding: 3px 7px; border-radius: 7px; flex-shrink: 0; }
    .faq-chevron { margin-inline-start: auto; color: var(--muted); transition: transform 0.2s var(--ease); flex-shrink: 0; }
    details.faq-item[open] .faq-chevron { transform: rotate(180deg); color: var(--cyan); }
    .faq-a { padding: 10px 14px 14px; font-size: 12.5px; color: #cbd5e1; line-height: 1.55; border-top: 1px solid rgba(255,255,255,0.05); white-space: pre-line; }
    .version-footer { margin-top: 20px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; }
    .version-footer summary { list-style: none; cursor: pointer; font-size: 11px; color: var(--muted); font-weight: 700; }
    .version-footer summary::-webkit-details-marker { display: none; }
    .version-badge { color: var(--cyan); }
    .changelog-box { text-align: start; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 11.5px; color: #cbd5e1; line-height: 1.55; }
    .legal-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 10px; }
    .legal-link-btn {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 5px 10px; border-radius: 99px; font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .legal-link-btn:active, .legal-link-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .legal-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0 12px; }
    .legal-tab {
      padding: 8px 4px; border-radius: 10px; text-align: center; font-size: 11px; font-weight: 700;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); cursor: pointer;
    }
    .legal-tab.active { background: rgba(34,211,238,0.18); color: var(--cyan); border-color: var(--cyan); }
    .legal-body {
      background: rgba(0,0,0,0.34); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px; font-size: 12.5px; line-height: 1.6; color: #cbd5e1; user-select: text;
    }
    .legal-body h4 { margin: 12px 0 5px; color: var(--cyan); font-size: 13px; }
    .legal-body h4:first-child { margin-top: 0; }
    .legal-body p { margin: 0 0 8px; }
    .legal-body ul { margin: 4px 0 10px; padding-inline-start: 18px; }
    .legal-body li { margin-bottom: 4px; }
    .legal-warn {
      background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.35);
      color: #fde68a; border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 12px;
    }
    .modal-backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(3,6,16,0.84); backdrop-filter: blur(8px); display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
    .modal-sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: #0d142a; border: 1px solid rgba(34,211,238,0.4); border-radius: 22px; padding: 18px; animation: fadeUp 0.22s var(--ease); }
    .progress-wrap { margin-top: 12px; }
    .progress-bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--cyan), var(--ok)); transition: width 0.2s; }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .mode-btn { padding: 10px; border-radius: 12px; text-align: center; font-size: 12px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); cursor: pointer; }
    .mode-btn.active { background: linear-gradient(135deg, #2563eb, #0891b2); color: #fff; border-color: var(--cyan); }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    input, textarea, select { width: 100%; padding: 11px 12px; border-radius: 12px; background: rgba(0,0,0,0.42); border: 1px solid var(--border); color: #fff; font-size: 14px; outline: none; }
    input:focus, textarea:focus { border-color: var(--cyan); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      width: 100%; padding: 13px 14px; border: none; border-radius: 13px; background: linear-gradient(135deg, #2563eb, #0891b2);
      color: #fff; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer; margin-top: 8px; text-decoration: none;
    }
    .btn:active { transform: scale(0.97); }
    .btn-tonal { background: var(--surface-2); border: 1px solid var(--border); color: #fff; }
    .btn-ok { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
    .btn-wa { background: #16a34a; color: #fff; }
    .btn-warn { background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.45); color: var(--warn); }
    .btn-danger { background: rgba(251,113,133,0.14); border: 1px solid rgba(251,113,133,0.4); color: var(--err); }
    .btn-sm { width: auto; padding: 8px 11px; font-size: 12px; border-radius: 10px; margin-top: 0; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; }
    .badge-warn { background: rgba(251,191,36,0.16); color: var(--warn); border: 1px solid rgba(251,191,36,0.35); }
    .badge-ok { background: rgba(52,211,153,0.15); color: var(--ok); border: 1px solid rgba(52,211,153,0.35); }
    .badge-err { background: rgba(251,113,133,0.16); color: var(--err); border: 1px solid rgba(251,113,133,0.35); }
    .hash-box { font-family: ui-monospace, monospace; font-size: 11px; word-break: break-all; background: rgba(0,0,0,0.45); padding: 10px; border-radius: 10px; border: 1px solid var(--border); color: var(--ok); }
    .thumb { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); }
    .flex { display: flex; gap: 12px; align-items: center; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .muted { font-size: 12px; color: var(--muted); line-height: 1.45; }
    .highlight-card { border-color: var(--ok) !important; box-shadow: 0 0 22px rgba(52,211,153,0.25); }
    nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; justify-content: space-around; align-items: center;
      background: rgba(7,11,26,0.94); backdrop-filter: blur(16px); border-top: 1px solid var(--border);
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; }
    .nav-pill { padding: 4px 14px; border-radius: 99px; transition: all 0.2s var(--ease); }
    .nav-item.active { color: #fff; }
    .nav-item.active .nav-pill { background: rgba(34,211,238,0.2); color: var(--cyan); }
    svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .hidden { display: none !important; }
    #toast {
      position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%); background: #131c3a; border: 1px solid var(--cyan); color: #fff;
      padding: 10px 18px; border-radius: 99px; font-size: 13px; font-weight: 600; display: none; z-index: 50; max-width: 90vw; text-align: center;
    }
    #print-cert { display: none; }
    @media print {
      body { background: #fff !important; color: #111 !important; padding: 0 !important; }
      body > *:not(#print-cert) { display: none !important; }
      #print-cert { display: block !important; padding: 24px; border: 2px solid #111; font-family: sans-serif; max-width: 760px; margin: 0 auto; }
      #print-cert .p-hash { font-family: monospace; background: #f1f5f9; padding: 10px; border: 1px solid #cbd5e1; word-break: break-all; font-size: 12px; }
      #print-cert img { max-width: 100%; max-height: 360px; margin-top: 14px; border: 1px solid #cbd5e1; }
    }
  </style>
</head>
<body>
<div class="cyber-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

<header>
  <div style="min-width:0;">
    <div class="logo">SHIELD<span>PROOF</span></div>
    <div class="sub"><span class="live-dot"></span><span id="lbl-sub"></span></div>
  </div>
  <div class="lang-bar">
    <button class="lang-pill active" data-lang="fr" onclick="setLang('fr')">FR</button>
    <button class="lang-pill" data-lang="en" onclick="setLang('en')">EN</button>
    <button class="lang-pill" data-lang="ar" onclick="setLang('ar')">AR</button>
    <button class="lang-pill" data-lang="zh" onclick="setLang('zh')">中文</button>
  </div>
</header>

<main>
  <section id="view-scan" class="anim">
    <div class="card" style="padding:12px;">
      <label class="hero-scan" for="scan-input">
        <div class="scan-laser"></div>
        <div class="radar-wrap">
          <div class="radar-ring"></div><div class="radar-ring radar-ring-2"></div>
          <div class="scan-icon"><svg style="width:28px;height:28px;" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
        </div>
        <div style="font-size:17px;font-weight:800;" id="lbl-hero-title"></div>
        <div class="muted" style="margin-top:6px;" id="lbl-hero-sub"></div>
        <input type="file" id="scan-input" accept="image/*" onchange="handleSmartScan(event)">
      </label>
      <div id="scan-progress" class="progress-wrap hidden">
        <div class="muted" id="lbl-ocr-status"></div>
        <div class="progress-bar" style="margin-top:6px;"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
    </div>

    <div id="scan-result" class="card anim hidden">
      <div class="flex" style="justify-content:space-between;">
        <span class="badge badge-ok" id="lbl-ai-detected"></span>
        <button class="btn btn-tonal btn-sm" onclick="closeScanResult()">✕</button>
      </div>
      <div style="margin-top:10px;text-align:center;"><img id="scan-thumb" class="thumb hidden" style="width:96px;height:96px;" alt=""></div>
      <div class="mode-switch">
        <div class="mode-btn active" id="mode-sub-btn" onclick="switchDetectedMode('SUB')">🛡️ <span id="lbl-mode-sub"></span></div>
        <div class="mode-btn" id="mode-proof-btn" onclick="switchDetectedMode('PROOF')">📸 <span id="lbl-mode-proof"></span></div>
      </div>
      <div id="form-sub">
        <div id="trap-alerts" style="margin-bottom:10px;"></div>
        <div class="field"><label id="lbl-sub-name"></label><input type="text" id="sub-name"></div>
        <div class="row">
          <div class="field"><label id="lbl-sub-price"></label><input type="number" step="0.01" id="sub-price" oninput="updateAnnualCost()"></div>
          <div class="field"><label id="lbl-sub-curr"></label>
            <select id="sub-curr" onchange="updateAnnualCost()"><option value="EUR">EUR (€)</option><option value="USD">USD ($)</option><option value="SAR">SAR</option><option value="CNY">CNY (¥)</option></select>
          </div>
        </div>
        <div class="row">
          <div class="field"><label id="lbl-sub-date"></label><input type="date" id="sub-date"></div>
          <div class="field"><label id="lbl-sub-annual"></label><input type="text" id="sub-annual" readonly></div>
        </div>
        <div class="field"><label id="lbl-sub-letter"></label><textarea id="sub-letter" rows="4"></textarea></div>
        <div id="official-cancel-wrap" class="hidden" style="margin-bottom:8px;">
          <a id="official-cancel-link" href="#" target="_blank" rel="noopener" class="btn btn-warn">🔗 <span id="txt-official-link"></span></a>
        </div>
        <button class="btn btn-ok" onclick="saveSubAndAlarm()">⏰ <span id="txt-save-sub"></span></button>
      </div>
      <div id="form-proof" class="hidden">
        <div class="field"><label id="lbl-proof-title"></label><input type="text" id="proof-title"></div>
        <div class="field"><label id="lbl-proof-cat"></label>
          <select id="proof-cat">
            <option value="RENTAL_CAR">Location voiture / Caution</option>
            <option value="APARTMENT">État des lieux / Airbnb</option>
            <option value="PACKAGE">Colis / Vente en ligne</option>
            <option value="CONTRACT">Contrat / Devis</option>
            <option value="OTHER">Autre preuve</option>
          </select>
        </div>
        <div class="field"><label id="lbl-proof-local-time"></label><input type="text" id="proof-local-time" readonly style="color:var(--cyan);font-weight:700;"></div>
        <div class="field"><label id="lbl-proof-hash"></label><div class="hash-box" id="proof-hash-preview"></div></div>
        <div class="field"><label id="lbl-proof-time"></label><input type="text" id="proof-time" readonly></div>
        <button class="btn btn-ok" onclick="saveProof()">🔒 <span id="txt-save-proof"></span></button>
      </div>
    </div>

    <div id="home-hud" class="anim">
      <div class="plan-bar" onclick="openProModal()">
        <div><div style="font-size:13px;font-weight:800;" id="lbl-plan-status"></div><div class="muted" id="lbl-plan-sub"></div></div>
        <span class="badge badge-ok" id="lbl-plan-cta"></span>

        if (!db.objectStoreNames.contains('subs')) db.createObjectStore('subs', { keyPath: 'id' });

      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });

    const db = await openDb();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).put(item);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  async function dbAll(store) {
    const db = await openDb();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => res((req.result || []).sort((a, b) => b.id - a.id));
      req.onerror = () => rej(req.error);
    });
  }
  async function dbDel(store, id) {
    const db = await openDb();

      tx.objectStore(store).delete(id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }

  function formatLocalDateTime(d) {
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3200);
  }
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function copySafe(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    }
    fallbackCopy(text);
    return Promise.resolve();
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta);
  }

  function openProModal() { document.getElementById('pro-modal').classList.remove('hidden'); }
  function closeProModal() { document.getElementById('pro-modal').classList.add('hidden'); }
  function openGumroadCheckout(plan) {
    const url = plan === 'unlimited' ? GUMROAD_CONFIG.proUrl : GUMROAD_CONFIG.pack10Url;
    if (!url) { toast(I18N[lang].checkoutNotReady); return; }
    window.open(url, '_blank', 'noopener');
  }

  function openLegalModal(tab) {
    currentLegalTab = tab || 'mentions';
    switchLegalTab(currentLegalTab);
    document.getElementById('legal-modal').classList.remove('hidden');
  }
  function closeLegalModal() {
    document.getElementById('legal-modal').classList.add('hidden');
  }
  function switchLegalTab(tab) {
    currentLegalTab = tab;
    document.querySelectorAll('.legal-tab').forEach((el) => el.classList.toggle('active', el.dataset.ltab === tab));
    const L = LEGAL_TEXTS[lang] || LEGAL_TEXTS.fr;
    document.getElementById('legal-content').innerHTML = L.content[tab] || L.content.mentions;
  }
  function copyLegalText() {
    const txt = document.getElementById('legal-content').innerText || '';
    if (txt) copySafe(txt).then(() => toast(I18N[lang].copiedToast));
  }

  async function verifyKeyWithProduct(productId, key, increment) {
    if (!productId || !GUMROAD_CONFIG.verifyProxyUrl) return { ok: false };
    try {
      const res = await fetch(GUMROAD_CONFIG.verifyProxyUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          product_id: productId,
          license_key: key,
          increment_uses_count: increment ? 'true' : 'false'
        })
      });
      const data = await res.json();
      const p = data.purchase || {};
      const active = Boolean(data.success) && !p.refunded && !p.chargebacked && !p.disputed && !p.subscription_cancelled_at;
      return { ok: active, uses: data.uses || 1 };
    } catch (_) {
      return { ok: false };
    }
  }

  async function activateGumroadKey() {
    const t = I18N[lang];
    const key = document.getElementById('in-license-key').value.trim();
    if (!key) return;
    if (!GUMROAD_CONFIG.verifyProxyUrl) { toast(t.checkoutNotReady); return; }
    const lic = saveLicenseState({});
    if (lic.activatedKeys.includes(key)) { toast(t.keyAlreadyUsed); return; }
    const btn = document.getElementById('btn-activate-key');
    btn.disabled = true;

    const proCheck = await verifyKeyWithProduct(GUMROAD_CONFIG.proProductId, key, false);
    if (proCheck.ok) {
      saveLicenseState({ proUnlimited: true, activatedKeys: [...lic.activatedKeys, key] });
      btn.disabled = false;
      closeProModal();
      renderHomeHud();
      toast(t.keySuccessPro);
      return;
    }
    const packCheck = await verifyKeyWithProduct(GUMROAD_CONFIG.pack10ProductId, key, true);
    btn.disabled = false;
    if (packCheck.ok && packCheck.uses <= 2) {
      saveLicenseState({ credits: (lic.credits || 0) + 10, activatedKeys: [...lic.activatedKeys, key] });
      closeProModal();
      renderHomeHud();
      toast(t.keySuccessPack);
      return;
    }
    toast(t.keyInvalid);
  }

  async function sha256Hex(buffer) {
    if (!window.crypto || !window.crypto.subtle) return 'HTTPS_REQUIRED';
    const digest = await crypto.subtle.digest('SHA-256', buffer);
    return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  function makeThumb(file) {
    return new Promise((resolve) => {
      const r = new FileReader();
      r.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          const max = 600;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            const ratio = Math.min(max / w, max / h);
            w = Math.round(w * ratio); h = Math.round(h * ratio);
          }
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.82));
        };
        img.src = e.target.result;
      };
      r.readAsDataURL(file);
    });
  }

  function analyzeOcrText(text) {
    const lower = (text || '').toLowerCase();
    const matchedService = SERVICES_DB.find((s) => s.keys.some((k) => lower.includes(k)));
    const hasSubWords = /(trial|essai|renew|renouvel|subscription|abonnement|\/mo|\/mois|month|billing|factur|cancel|résilier|plan)/i.test(lower);
    const isSub = Boolean(matchedService || hasSubWords);
    let price = '';
    const priceMatch = text.match(/(?:€|\$|£|SAR|¥)\s?(\d+(?:[.,]\d{1,2})?)|(\d+(?:[.,]\d{1,2})?)\s?(?:€|\$|EUR|USD|SAR)/i);
    if (priceMatch) price = (priceMatch[1] || priceMatch[2] || '').replace(',', '.');
    let curr = 'EUR';
    if (/\$|USD/i.test(text)) curr = 'USD';
    else if (/SAR/i.test(text)) curr = 'SAR';
    else if (/¥|CNY/i.test(text)) curr = 'CNY';
    let days = 7;
    const daysMatch = lower.match(/(\d+)\s*(?:day|days|jour|jours)/);
    if (daysMatch) days = Math.min(365, Math.max(1, parseInt(daysMatch[1], 10)));
    const targetDate = new Date(Date.now() + days * 86400000).toISOString().slice(0, 10);
    const hasAutoRenew = /(auto-?renew|reconduction|renouvellement automatique|automatically)/i.test(lower);
    const hasTrial = /(free trial|essai gratuit|0\s?€|\$0)/i.test(lower);
    let proofCat = 'OTHER';
    if (/(car|rental|voiture|kilom|vehicle|auto)/i.test(lower)) proofCat = 'RENTAL_CAR';
    else if (/(airbnb|apartment|lease|bail|loyer|room)/i.test(lower)) proofCat = 'APARTMENT';
    else if (/(order|tracking|colis|delivery|vinted|amazon|package)/i.test(lower)) proofCat = 'PACKAGE';
    else if (/(contract|contrat|devis|terms|invoice)/i.test(lower)) proofCat = 'CONTRACT';
    return { isSub, serviceName: matchedService ? matchedService.name : (isSub ? 'Abonnement détecté' : ''), cancelUrl: matchedService ? matchedService.url : '', price, curr, targetDate, hasAutoRenew, hasTrial, proofCat };
  }

  async function handleSmartScan(event) {
    const file = event.target.files[0];
    if (!file) return;
    const t = I18N[lang];
    const nowObj = new Date();
    const nowIso = nowObj.toISOString();
    const localTime = formatLocalDateTime(nowObj);
    const prog = document.getElementById('scan-progress');
    const fill = document.getElementById('progress-fill');
    document.getElementById('lbl-ocr-status').textContent = t.ocrRunning;
    prog.classList.remove('hidden');
    document.getElementById('home-hud').classList.add('hidden');
    document.getElementById('scan-result').classList.add('hidden');
    fill.style.width = '12%';

    const arrayBuffer = await file.arrayBuffer();
    const hash = await sha256Hex(arrayBuffer);
    const thumb = await makeThumb(file);
    let ocrText = '';
    try {
      if (typeof Tesseract !== 'undefined') {
        const res = await Tesseract.recognize(file, 'eng+fra', {
          logger: (m) => { if (m.status === 'recognizing text') fill.style.width = `${Math.max(15, Math.round(m.progress * 100))}%`; }
        });
        ocrText = res.data.text || '';
      }
    } catch (_) { ocrText = ''; }
    fill.style.width = '100%';
    prog.classList.add('hidden');

    const ai = analyzeOcrText(ocrText);
    const safeName = file.name || `capture_${nowIso.slice(0,10)}.jpg`;
    currentScan = { file, fileName: safeName, hash, thumb, nowIso, localTime, ai, ocrText };
    const thumbEl = document.getElementById('scan-thumb');
    thumbEl.src = thumb; thumbEl.classList.remove('hidden');

    document.getElementById('sub-name').value = ai.serviceName;
    document.getElementById('sub-price').value = ai.price;
    document.getElementById('sub-curr').value = ai.curr;
    document.getElementById('sub-date').value = ai.targetDate;
    updateAnnualCost();
    document.getElementById('sub-letter').value = t.letterTemplate(ai.serviceName || 'Service', ai.targetDate);
    const traps = [];
    if (ai.hasAutoRenew) traps.push(`<span class="badge badge-err">${esc(t.trapAutoRenew)}</span>`);
    if (ai.hasTrial) traps.push(`<span class="badge badge-warn">${esc(t.trapTrial)}</span>`);
    document.getElementById('trap-alerts').innerHTML = traps.join(' ');
    const linkWrap = document.getElementById('official-cancel-wrap');
    if (ai.cancelUrl) { document.getElementById('official-cancel-link').href = ai.cancelUrl; linkWrap.classList.remove('hidden'); }
    else linkWrap.classList.add('hidden');

    document.getElementById('proof-title').value = safeName.replace(/\.[^.]+$/, '') || `Preuve ${localTime.slice(0,10)}`;
    document.getElementById('proof-cat').value = ai.proofCat;
    document.getElementById('proof-local-time').value = localTime;
    document.getElementById('proof-hash-preview').textContent = hash;
    document.getElementById('proof-time').value = nowIso;
    switchDetectedMode(ai.isSub ? 'SUB' : 'PROOF');
    document.getElementById('scan-result').classList.remove('hidden');
    event.target.value = '';
  }

  function downloadIcsAlarm(name, dateStr, priceText) {
    const dt = new Date(dateStr + 'T09:00:00');
    dt.setDate(dt.getDate() - 2);
    const pad = (n) => String(n).padStart(2, '0');
    const stamp = `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T090000`;
    const ics = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SHIELDPROOF//EN','BEGIN:VEVENT',
      `UID:sp-${Date.now()}@shieldproof`,`DTSTART:${stamp}`,`SUMMARY:CANCEL ${name} (${priceText})`,
      `DESCRIPTION:ShieldProof Alert: Cancel ${name} before charge on ${dateStr}.`,
      'BEGIN:VALARM','TRIGGER:-PT0M','ACTION:DISPLAY','DESCRIPTION:Cancel subscription now!','END:VALARM',
      'END:VEVENT','END:VCALENDAR'
    ].join('\r\n');
    const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    const a = document.createElement('a'); a.href = url; a.download = `cancel_${name.replace(/[^a-z0-9]/gi,'_')}.ics`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  async function buildCertificateCanvas(p) {
    const dt = p.localTime || formatLocalDateTime(new Date(p.timestamp));
    const canvas = document.createElement('canvas');
    canvas.width = 1240; canvas.height = 1754;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#070b1a'; ctx.fillRect(0, 0, canvas.width, 210);
    ctx.fillStyle = '#22d3ee'; ctx.font = 'bold 48px sans-serif'; ctx.fillText(`SHIELDPROOF v${APP_VERSION}`, 60, 88);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 30px sans-serif'; ctx.fillText('CERTIFICAT D’INTÉGRITÉ / INTEGRITY CERTIFICATE', 60, 142);
    ctx.fillStyle = '#34d399'; ctx.font = 'bold 26px monospace'; ctx.fillText(`ID: ${p.certId}`, 60, 185);
    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 30px sans-serif'; ctx.fillText(`Date & Heure : ${dt}`, 60, 275);
    ctx.fillStyle = '#334155'; ctx.font = '24px sans-serif';
    ctx.fillText(`UTC : ${p.timestamp}`, 60, 322);
    ctx.fillText(`Objet : ${String(p.title).slice(0,52)} (${p.cat})`, 60, 368);
    ctx.fillText(`Fichier original : ${String(p.fileName).slice(0,44)} (${p.fileSize} bytes)`, 60, 414);
    ctx.fillStyle = '#f1f5f9'; ctx.fillRect(60, 448, canvas.width - 120, 150);
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2; ctx.strokeRect(60, 448, canvas.width - 120, 150);
    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 22px sans-serif'; ctx.fillText('EMPREINTE CRYPTOGRAPHIQUE SHA-256 (0 PIXEL MODIFIÉ) :', 84, 490);
    ctx.fillStyle = '#0369a1'; ctx.font = 'bold 26px monospace';
    ctx.fillText(p.hash.slice(0,32), 84, 535); ctx.fillText(p.hash.slice(32), 84, 575);
    if (p.thumb) {
      await new Promise((res) => {
        const img = new Image();
        img.onload = () => {
          const maxW = canvas.width - 120, maxH = 950;
          const ratio = Math.min(maxW / img.width, maxH / img.height);
          const w = img.width * ratio, h = img.height * ratio;
          const x = (canvas.width - w) / 2, y = 635;
          ctx.drawImage(img, x, y, w, h);
          ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
          res();
        };
        img.onerror = res;
        img.src = p.thumb;
      });
    }
    ctx.fillStyle = '#64748b'; ctx.font = '20px sans-serif';
    ctx.fillText('Généré localement par SHIELDPROOF (Web Crypto SHA-256). Toute retouche IA modifie ce code.', 60, 1685);
    return canvas;
  }

  async function shareProofPdf(id) {
    const p = proofsCache.find((x) => x.id === id);
    if (!p) return;
    if (!window.jspdf || !window.jspdf.jsPDF) { printCertificatePdf(id); return; }
    const canvas = await buildCertificateCanvas(p);
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    doc.addImage(imgData, 'JPEG', 0, 0, 210, 297);
    const pdfBlob = doc.output('blob');
    const pdfFile = new File([pdfBlob], `${p.certId}.pdf`, { type: 'application/pdf' });
    const text = buildProofShareText(p);
    if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
      try { await navigator.share({ title: `${p.certId}.pdf`, text, files: [pdfFile] }); return; }
      catch (err) { if (err && err.name === 'AbortError') return; }
    }
    doc.save(`${p.certId}.pdf`);
  }

  async function shareProofImage(id) {
    const p = proofsCache.find((x) => x.id === id);
    if (!p) return;
    const canvas = await buildCertificateCanvas(p);
    canvas.toBlob(async (blob) => {
      if (!blob) return;
      const file = new File([blob], `${p.certId}_proof.png`, { type: 'image/png' });
      const text = buildProofShareText(p);
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ title: p.certId, text, files: [file] }); return; }
        catch (err) { if (err && err.name === 'AbortError') return; }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `${p.certId}_proof.png`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, 'image/png');
  }

        </div>
        <div class="actions">
          ${!s.cancelled ? `<button class="btn btn-ok btn-sm" onclick="markSubCancelled(${s.id})">${esc(t.cancelBtn)}</button>` : ''}
          <button class="btn btn-tonal btn-sm" onclick="copySubLetter(${s.id})">${esc(t.copyBtn)}</button>
          <button class="btn btn-tonal btn-sm" onclick="reAlarm(${s.id})">${esc(t.alarmBtn)}</button>
          <button class="btn btn-danger btn-sm" onclick="deleteSub(${s.id})">${esc(t.delBtn)}</button>
        </div>
      </div>`).join('');
  }
  async function markSubCancelled(id) {
    const list = await dbAll('subs'); const item = list.find((x) => x.id === id);
    if (!item) return; item.cancelled = true; await dbPut('subs', item); renderSubs(); renderHomeHud();
  }
  async function copySubLetter(id) {
    const list = await dbAll('subs'); const item = list.find((x) => x.id === id);
    if (item) copySafe(item.letter).then(() => toast(I18N[lang].copiedToast));
  }
  async function reAlarm(id) {
    const list = await dbAll('subs'); const item = list.find((x) => x.id === id);
    if (item && item.date) downloadIcsAlarm(item.name, item.date, `${item.price} ${item.curr}`);
  }
  async function deleteSub(id) { await dbDel('subs', id); renderSubs(); renderHomeHud(); }

  async function renderProofs() {
    const t = I18N[lang];
    const list = await dbAll('proofs');
    proofsCache = list;
    const box = document.getElementById('proofs-list');
    if (!list.length) { box.innerHTML = `<div class="card muted">${esc(t.emptyProofs)}</div>`; return; }
    box.innerHTML = list.map((p) => {
      const dt = p.localTime || formatLocalDateTime(new Date(p.timestamp));
      const hl = p.id === lastCreatedProofId ? 'highlight-card' : '';
      return `<div class="card ${hl}">
        <div class="flex">${p.thumb ? `<img class="thumb" src="${p.thumb}" alt="">` : ''}
          <div style="flex:1;min-width:0;"><strong>${esc(p.title)}</strong>
          <div class="muted" style="color:var(--cyan);font-weight:600;">${esc(p.certId)} • ${esc(dt)}</div>
          <div class="muted" style="font-family:monospace;overflow:hidden;text-overflow:ellipsis;">SHA256: ${esc(p.hash.slice(0,18))}...</div></div>
        </div>
        <div class="actions">
          <button class="btn btn-wa btn-sm" onclick="shareProofPdf(${p.id})">📲 ${esc(t.pdfShareBtn)}</button>
          <button class="btn btn-tonal btn-sm" onclick="shareProofImage(${p.id})">🖼️ ${esc(t.imgShareBtn)}</button>
          <button class="btn btn-tonal btn-sm" onclick="shareProofWhatsApp(${p.id})">💬 ${esc(t.waTextBtn)}</button>
          <button class="btn btn-tonal btn-sm" onclick="shareProofEmail(${p.id})">✉️ ${esc(t.mailBtn)}</button>
          <button class="btn btn-danger btn-sm" onclick="deleteProof(${p.id})">${esc(t.delBtn)}</button>
        </div></div>`;
    }).join('');
  }

  async function verifyPhotoFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const t = I18N[lang];
    const hash = await sha256Hex(await file.arrayBuffer());
    const list = await dbAll('proofs');
    const match = list.find((p) => p.hash === hash);
    const box = document.getElementById('verify-result');
    box.classList.remove('hidden');
    box.innerHTML = match
      ? `<div class="badge badge-ok" style="display:block;padding:10px;">${esc(t.authOk)}<br><small>${esc(match.certId)} • ${esc(match.localTime || match.timestamp)}</small></div>`
      : `<div class="badge badge-err" style="display:block;padding:10px;">${esc(t.authFail)}</div>`;
    event.target.value = '';
  }
  async function deleteProof(id) { await dbDel('proofs', id); renderProofs(); renderHomeHud(); }

  async function exportBackupJson() {
    const subs = await dbAll('subs');
    const proofs = (await dbAll('proofs')).map(({ thumb, ...rest }) => rest);
    const url = URL.createObjectURL(new Blob([JSON.stringify({ app: `SHIELDPROOF v${APP_VERSION}`, subs, proofs }, null, 2)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = 'shieldproof_backup.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  async function clearAllDb() {
    if (!confirm(I18N[lang].confirmClear)) return;
    await dbClearAll(); renderSubs(); renderProofs(); renderHomeHud(); toast('OK');
  }

  setLang(lang);
</script>
</body>
</html>
