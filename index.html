    <div class="field" style="margin-top:14px;">
      <label id="lbl-license-input"></label>
      <input type="text" id="in-license-key" placeholder="XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX">
    </div>
    <button class="btn" id="btn-activate-key" onclick="activateGumroadKey()">🔓 <span id="txt-activate-key"></span></button>
    <div class="legal-links" style="margin-top:12px;">
      <button class="legal-link-btn" onclick="openLegalModal('cgu')" id="pro-lnk-cgu"></button>
      <button class="legal-link-btn" onclick="openLegalModal('rgpd')" id="pro-lnk-rgpd"></button>
      <button class="legal-link-btn" onclick="openLegalModal('ccpa')" id="pro-lnk-ccpa"></button>
    </div>
  </div>
</div>

<div id="legal-modal" class="modal-backdrop hidden" onclick="if(event.target===this) closeLegalModal()">
  <div class="modal-sheet">
    <div class="flex" style="justify-content:space-between;margin-bottom:6px;">
      <strong style="font-size:16px;" id="lbl-legal-modal-title"></strong>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-tonal btn-sm" onclick="copyLegalText()" id="btn-copy-legal">📋</button>
        <button class="btn btn-tonal btn-sm" onclick="closeLegalModal()">✕</button>
      </div>
    </div>
    <div class="legal-tabs">
      <div class="legal-tab active" data-ltab="mentions" onclick="switchLegalTab('mentions')" id="ltab-mentions"></div>
      <div class="legal-tab" data-ltab="cgu" onclick="switchLegalTab('cgu')" id="ltab-cgu"></div>
      <div class="legal-tab" data-ltab="rgpd" onclick="switchLegalTab('rgpd')" id="ltab-rgpd"></div>
      <div class="legal-tab" data-ltab="ccpa" onclick="switchLegalTab('ccpa')" id="ltab-ccpa"></div>
    </div>
    <div class="legal-body" id="legal-content"></div>
  </div>
</div>

<div id="print-cert"></div>
<div id="toast"></div>

<script src="./shieldproof-v10.js" defer></script>
<script src="./shieldproof-v11.js" defer></script>
<script src="./app.js"></script>
</body>
</html>
