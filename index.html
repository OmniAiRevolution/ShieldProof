        if (!db.objectStoreNames.contains('keys')) db.createObjectStore('keys', { keyPath: 'id' });

      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

    const db = await openDb();

      tx.objectStore(store).put(item);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  async function dbAll(store) {
    const db = await openDb();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => res((req.result || []).sort((a, b) => b.id - a.id));
      req.onerror = () => rej(req.error);
    });
  }
  async function dbDel(store, id) {
    const db = await openDb();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).delete(id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }

    const db = await openDb();

      const tx = db.transaction(['subs', 'proofs'], 'readwrite');

  // ============================================================
  // 🤖 DÉTECTION D'IMAGES IA (100 % LOCALE)
  // ============================================================
  // Combine 3 analyses :
  // 1. Métadonnées : recherche signatures Midjourney / Stable Diffusion / DALL-E / Flux / ComfyUI
  // 2. Pixels : variance (les IA sur-lissent les textures)
  // 3. Bruit + saturation : les IA génèrent un bruit anormal ou des saturations extrêmes
  // ============================================================

  const AI_SIGNATURES = [
    'midjourney', 'stable diffusion', 'stablediffusion', 'dall-e', 'dall·e', 'dalle',
    'comfyui', 'automatic1111', 'invokeai', 'novelai', 'leonardo.ai', 'firefly',
    'adobe firefly', 'flux.1', 'black forest labs', 'runwayml', 'runway ml',
    'generated by ai', 'ai-generated', 'ai generated', 'synthetic image',
    'c2pa.ai', 'openai', 'imagen', 'sora'
  ];

  // Lit les premiers Ko du fichier à la recherche de signatures texte
  async function scanMetadataSignatures(file) {
    try {
      const slice = file.slice(0, 65536); // 64 Ko suffisent pour header + EXIF
      const buf = await slice.arrayBuffer();
      const bytes = new Uint8Array(buf);
      // Décodage latin1 pour ne pas planter sur des octets non-UTF8
      let text = '';
      for (let i = 0; i < bytes.length; i++) {
        text += String.fromCharCode(bytes[i]);
      }
      const lower = text.toLowerCase();
      for (const sig of AI_SIGNATURES) {
        if (lower.includes(sig)) return { found: true, signature: sig };
      }
      return { found: false, signature: null };
    } catch (_) {
      return { found: false, signature: null };
    }
  }

  // Analyse pixel : variance, lissage, bruit, saturation
  async function analyzePixelStatistics(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          try {
            const SIZE = 128;
            const canvas = document.createElement('canvas');
            canvas.width = SIZE; canvas.height = SIZE;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(img, 0, 0, SIZE, SIZE);
            const data = ctx.getImageData(0, 0, SIZE, SIZE).data;

            // 1) Variance horizontale + verticale (détection sur-lissage)
            let varH = 0, varV = 0, count = 0;
            for (let y = 0; y < SIZE; y++) {
              for (let x = 0; x < SIZE - 1; x++) {
                const i = (y * SIZE + x) * 4;
                const j = i + 4;
                varH += Math.abs(data[i] - data[j]) + Math.abs(data[i+1] - data[j+1]) + Math.abs(data[i+2] - data[j+2]);
                count++;
              }
            }
            for (let y = 0; y < SIZE - 1; y++) {
              for (let x = 0; x < SIZE; x++) {
                const i = (y * SIZE + x) * 4;
                const j = i + SIZE * 4;
                varV += Math.abs(data[i] - data[j]) + Math.abs(data[i+1] - data[j+1]) + Math.abs(data[i+2] - data[j+2]);
              }
            }
            const avgVariance = (varH + varV) / (count * 2);

            // 2) Bruit local (écart-type des différences voisines)
            let noiseSum = 0, noiseCount = 0;
            for (let i = 0; i < data.length - 4; i += 16) { // échantillonnage rapide
              const diff = Math.abs(data[i] - data[i+4]) + Math.abs(data[i+1] - data[i+5]) + Math.abs(data[i+2] - data[i+6]);
              noiseSum += diff * diff;
              noiseCount++;
            }
            const noiseLevel = Math.sqrt(noiseSum / Math.max(1, noiseCount));

            // 3) Saturation extrême (les IA poussent souvent les couleurs)
            let satSum = 0, satCount = 0, extremeSat = 0;
            for (let i = 0; i < data.length; i += 4) {
              const r = data[i], g = data[i+1], b = data[i+2];
              const max = Math.max(r, g, b), min = Math.min(r, g, b);
              const sat = max === 0 ? 0 : (max - min) / max;
              satSum += sat; satCount++;
              if (sat > 0.92 || (max > 250 && min < 5)) extremeSat++;
            }
            const avgSat = satSum / Math.max(1, satCount);
            const extremeSatRatio = extremeSat / Math.max(1, satCount);

            resolve({
              avgVariance, noiseLevel, avgSat, extremeSatRatio,
              width: img.width, height: img.height
            });
          } catch (err) {
            resolve({ error: String(err) });
          }
        };
        img.onerror = () => resolve({ error: 'decode_failed' });
        img.src = e.target.result;
      };
      reader.onerror = () => resolve({ error: 'read_failed' });
      reader.readAsDataURL(file);
    });
  }

  // Score final combiné
  function computeAIScore(metaResult, pixelResult) {
    // Si signature explicite → très haut score
    if (metaResult.found) {
      return { score: 0.97, metaScore: 1, pixelScore: 0, reasons: ['meta'], detail: { signature: metaResult.signature } };
    }

    if (pixelResult.error) {
      return { score: 0.3, metaScore: 0, pixelScore: 0, reasons: ['error'], detail: pixelResult };
    }

    let pixelScore = 0;
    const reasons = [];

    // Sur-lissage : variance basse = suspect
    // Photos réelles : variance > 25  |  IA sur-lissées : variance < 8
    if (pixelResult.avgVariance < 5) { pixelScore += 0.35; reasons.push('smooth'); }
    else if (pixelResult.avgVariance < 12) { pixelScore += 0.18; }

    // Bruit : bruit très faible (image "propre") = suspect
    if (pixelResult.noiseLevel < 3) { pixelScore += 0.20; reasons.push('low_noise'); }
    else if (pixelResult.noiseLevel < 6) { pixelScore += 0.08; }

    // Saturation extrême = suspect
    if (pixelResult.extremeSatRatio > 0.15) { pixelScore += 0.20; reasons.push('extreme_sat'); }
    else if (pixelResult.avgSat > 0.72) { pixelScore += 0.10; reasons.push('high_sat'); }

    // Dimensions standardisées IA : multiples de 64
    if (pixelResult.width % 64 === 0 && pixelResult.height % 64 === 0 &&
        pixelResult.width >= 512 && pixelResult.height >= 512) {
      pixelScore += 0.10;
      reasons.push('ai_dimensions');
    }

    // Cap du score
    pixelScore = Math.min(0.85, pixelScore);

    return {
      score: pixelScore,
      metaScore: 0,
      pixelScore,
      reasons,
      detail: pixelResult
    };
  }

  // Fonction principale appelée par le scan
  async function detectAIImage(file, onProgress) {
    if (onProgress) onProgress(10);
    const metaResult = await scanMetadataSignatures(file);
    if (onProgress) onProgress(45);
    const pixelResult = await analyzePixelStatistics(file);
    if (onProgress) onProgress(85);
    const final = computeAIScore(metaResult, pixelResult);
    if (onProgress) onProgress(100);
    return final;
  }

  // Affichage du panneau de détection
  function renderAIDetectionPanel(result) {
    const t = I18N[lang];
    const card = document.getElementById('ai-detection-card');
    if (!card) return;

    const pct = Math.round(result.score * 100);
    card.classList.remove('hidden', 'safe', 'suspect');

    // Titre et badge selon score
    let title, badgeText, badgeClass, cardClass;
    if (result.metaScore > 0.5) {
      title = t.aiDetectHigh;
      badgeText = '🔴 ' + pct + '%';
      badgeClass = 'badge-err';
      cardClass = 'suspect';
    } else if (pct >= 60) {
      title = t.aiDetectHigh;
      badgeText = '🔴 ' + pct + '%';
      badgeClass = 'badge-err';
      cardClass = 'suspect';
    } else if (pct >= 35) {
      title = t.aiDetectSuspect;
      badgeText = '🟠 ' + pct + '%';
      badgeClass = 'badge-warn';
      cardClass = 'suspect';
    } else {
      title = t.aiDetectSafe;
      badgeText = '🟢 ' + pct + '%';
      badgeClass = 'badge-ok';
      cardClass = 'safe';
    }
    card.classList.add(cardClass);

    document.getElementById('ai-detection-title').textContent = title;
    const badge = document.getElementById('ai-detection-badge');
    badge.textContent = badgeText;
    badge.className = 'badge ' + badgeClass;

    // Raison
    let reason = t.aiDetectReasonLow;
    if (result.metaScore > 0.5) reason = t.aiDetectReasonMeta;
    else if (pct >= 60) reason = t.aiDetectReasonHigh;
    else if (pct >= 35) reason = t.aiDetectReasonMid;
    document.getElementById('ai-detection-reason').textContent = reason;

    // Barre
    document.getElementById('ai-score-fill').style.width = pct + '%';
    document.getElementById('ai-score-label').textContent = `${t.aiDetectScoreLabel} : ${pct}%`;

    // Détails
    document.getElementById('ai-details-summary').textContent = t.aiDetectDetails;
    document.getElementById('ai-detail-meta-label').textContent = t.aiDetectMeta;
    document.getElementById('ai-detail-noise-label').textContent = t.aiDetectNoise;
    document.getElementById('ai-detail-smooth-label').textContent = t.aiDetectSmooth;
    document.getElementById('ai-detail-sat-label').textContent = t.aiDetectSat;

    const metaVal = result.metaScore > 0.5
      ? '⚠️ ' + (result.detail?.signature || 'IA')
      : '✓ ' + 'Aucune';
    document.getElementById('ai-detail-meta-val').textContent = metaVal;

    if (result.detail && !result.detail.error) {

  function formatLocalDateTime(d) {
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3400);
  }

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function copySafe(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    }
    fallbackCopy(text);
    return Promise.resolve();
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta);
  }

  async function sha256Hex(buffer) {
    if (!window.crypto || !window.crypto.subtle) return 'HTTPS_REQUIRED';
    const digest = await crypto.subtle.digest('SHA-256', buffer);
    return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  function makeThumb(file) {
    return new Promise((resolve) => {
      const r = new FileReader();
      r.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          const max = 600;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            const ratio = Math.min(max / w, max / h);
            w = Math.round(w * ratio); h = Math.round(h * ratio);
          }
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.82));
        };
        img.src = e.target.result;
      };
      r.readAsDataURL(file);
    });
  }

  // ============================================================
  // 🔍 OCR + ANALYSE TEXTE
  // ============================================================

  function getOcrLangs() {
    if (lang === 'ar') return 'ara+eng';
    if (lang === 'zh') return 'chi_sim+eng';
    if (lang === 'en') return 'eng';
    return 'fra+eng';
  }

  function prepareOcrImage(file) {
    return new Promise((resolve) => {
      const r = new FileReader();
      r.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const max = 1400;
          if (img.width <= max && img.height <= max) { resolve(file); return; }
          const ratio = Math.min(max / img.width, max / img.height);
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * ratio); c.height = Math.round(img.height * ratio);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          c.toBlob((b) => resolve(b || file), 'image/jpeg', 0.88);
        };
        img.onerror = () => resolve(file);
        img.src = e.target.result;
      };
      r.onerror = () => resolve(file);
      r.readAsDataURL(file);
    });
  }

  function analyzeOcrText(text) {
    const lower = (text || '').toLowerCase();
    const matchedService = SERVICES_DB.find((s) => s.keys.some((k) => lower.includes(k)));
    const hasSubWords = /(trial|essai|renew|renouvel|subscription|abonnement|\/mo|\/mois|month|billing|factur|cancel|résilier|plan|اشتراك|تجربة|订阅|自动续费)/i.test(lower);
    const isSub = Boolean(matchedService || hasSubWords);
    let price = '';
    const priceMatch = text.match(/(?:€|\$|£|SAR|¥)\s?(\d+(?:[.,]\d{1,2})?)|(\d+(?:[.,]\d{1,2})?)\s?(?:€|\$|EUR|USD|SAR)/i);
    if (priceMatch) price = (priceMatch[1] || priceMatch[2] || '').replace(',', '.');
    let curr = 'EUR';
    if (/\$|USD/i.test(text)) curr = 'USD';
    else if (/SAR/i.test(text)) curr = 'SAR';
    else if (/¥|CNY/i.test(text)) curr = 'CNY';
    let days = 7;
    const daysMatch = lower.match(/(\d+)\s*(?:day|days|jour|jours)/);
    if (daysMatch) days = Math.min(365, Math.max(1, parseInt(daysMatch[1], 10)));
    const targetDate = new Date(Date.now() + days * 86400000).toISOString().slice(0, 10);
    const hasAutoRenew = /(auto-?renew|reconduction|renouvellement automatique|automatically|自动续费)/i.test(lower);
    const hasTrial = /(free trial|essai gratuit|0\s?€|\$0|免费试用)/i.test(lower);
    let proofCat = 'OTHER';
    if (/(accident|sinistre|crash|constat|assurance|insurance|حادث|تأمين|事故|保险)/i.test(lower)) proofCat = 'ACCIDENT';
    else if (/(car|rental|voiture|kilom|vehicle|auto|caution|سيارة|租车)/i.test(lower)) proofCat = 'RENTAL_CAR';
    else if (/(airbnb|apartment|lease|bail|loyer|room|immobilier|maison|شقة|房|民宿)/i.test(lower)) proofCat = 'APARTMENT';
    else if (/(order|tracking|colis|delivery|vinted|amazon|package|طرد|快递)/i.test(lower)) proofCat = 'PACKAGE';
    else if (/(contract|contrat|devis|terms|invoice|عقد|合同)/i.test(lower)) proofCat = 'CONTRACT';
    return { isSub, serviceName: matchedService ? matchedService.name : (isSub ? 'Abonnement détecté' : ''), cancelUrl: matchedService ? matchedService.url : '', price, curr, targetDate, hasAutoRenew, hasTrial, proofCat };
  }

  async function handleSmartScan(event) {
    const file = event.target.files[0];
    if (!file) return;
    event.target.value = '';
    const preset = pendingPresetCat;
    pendingPresetCat = '';
    const forceMode = preset === 'SUB' ? 'SUB' : (preset ? 'PROOF' : undefined);
    await processFileScan(file, forceMode, false, preset);

  async function processFileScan(file, forceMode, isDemo, presetCat) {
    const t = I18N[lang];
    const nowObj = new Date();
    const nowIso = nowObj.toISOString();
    const localTime = formatLocalDateTime(nowObj);
    const prog = document.getElementById('scan-progress');
    const fill = document.getElementById('progress-fill');
    const withTimeout = (promise, ms, label) => Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error(label + '_TIMEOUT')), ms))
    ]);
    if (!file || !file.type || !file.type.startsWith('image/')) { toast('Choisis un fichier image valide.'); return; }
    if (file.size > 25 * 1024 * 1024) { toast('Image trop volumineuse (maximum 25 Mo).'); return; }
    document.getElementById('lbl-ocr-status').textContent = t.ocrRunning;
    prog.classList.remove('hidden');
    document.getElementById('home-hud').classList.add('hidden');
    document.getElementById('scan-result').classList.add('hidden');
    fill.style.width = '5%';
    let hash = '', thumb = '', aiDetection = null, ocrText = '';
    try {
      const arrayBuffer = await withTimeout(file.arrayBuffer(), 10000, 'FILE_READ');
      hash = await withTimeout(sha256Hex(arrayBuffer), 10000, 'SHA256');
      if (!/^[a-f0-9]{64}$/i.test(hash)) throw new Error('SHA256_UNAVAILABLE');
      fill.style.width = '25%';
      try { thumb = await withTimeout(makeThumb(file), 8000, 'THUMBNAIL'); }
      catch (e) { console.warn('Thumbnail unavailable', e); thumb = ''; }
      fill.style.width = '40%';
      try {
        aiDetection = await withTimeout(detectAIImage(file, p => {
          fill.style.width = String(40 + Math.round(p * 0.2)) + '%';
        }), 6000, 'AI_HEURISTIC');
      } catch (e) { console.warn('AI heuristic timeout/error', e); aiDetection = null; }
      fill.style.width = '65%';
      try {
        if (typeof Tesseract !== 'undefined' && typeof Tesseract.recognize === 'function') {
          const ocrInput = await withTimeout(prepareOcrImage(file), 5000, 'OCR_PREPARE');
          const res = await withTimeout(Tesseract.recognize(ocrInput, getOcrLangs(), {
            logger: m => {
              if (m.status === 'recognizing text') fill.style.width = String(65 + Math.round(m.progress * 30)) + '%';
            }
          }), 15000, 'OCR');
          ocrText = res && res.data ? (res.data.text || '') : '';
        }
      } catch (e) { console.warn('OCR skipped', e); ocrText = ''; }
      fill.style.width = '100%';
      const ai = analyzeOcrText(ocrText);
      const safeName = file.name || ('capture_' + nowIso.slice(0,10) + '.jpg');
      currentScan = { file, fileName: safeName, hash, thumb, nowIso, localTime, ai, ocrText, isDemo: Boolean(isDemo), aiDetection, c2paStatus: null };
      window.__shieldProofCurrentScan = currentScan;
      const thumbEl = document.getElementById('scan-thumb');
      if (thumb) { thumbEl.src = thumb; thumbEl.classList.remove('hidden'); }
      else { thumbEl.removeAttribute('src'); thumbEl.classList.add('hidden'); }
      document.getElementById('demo-dl-wrap').classList.toggle('hidden', !isDemo);
      document.getElementById('sub-name').value = ai.serviceName || '';
      document.getElementById('sub-price').value = ai.price || '';
      document.getElementById('sub-curr').value = ai.curr || 'EUR';
      document.getElementById('sub-date').value = ai.targetDate || '';
      updateAnnualCost();
      document.getElementById('sub-letter').value = t.letterTemplate(ai.serviceName || 'Service', ai.targetDate || '');
      const traps = [];
      if (ai.hasAutoRenew) traps.push('<span class="badge badge-err">' + esc(t.trapAutoRenew) + '</span>');
      if (ai.hasTrial) traps.push('<span class="badge badge-warn">' + esc(t.trapTrial) + '</span>');
      document.getElementById('trap-alerts').innerHTML = traps.join(' ');
      const linkWrap = document.getElementById('official-cancel-wrap');
      if (ai.cancelUrl) { document.getElementById('official-cancel-link').href = ai.cancelUrl; linkWrap.classList.remove('hidden'); }
      else linkWrap.classList.add('hidden');
      document.getElementById('proof-title').value = safeName.replace(/\.[^.]+$/, '') || ('Preuve ' + localTime.slice(0,10));
      if (presetCat && presetCat !== 'SUB') document.getElementById('proof-cat').value = presetCat;
      else if (ai.proofCat && ai.proofCat !== 'OTHER') document.getElementById('proof-cat').value = ai.proofCat;
      try { const brand = getB2bBrand(); document.getElementById('proof-company').value = brand.name || ''; } catch (_) {}
      document.getElementById('proof-local-time').value = localTime;
      document.getElementById('proof-hash-preview').textContent = hash;
      document.getElementById('proof-time').value = nowIso;
      try { refreshB2bUi(); } catch (_) {}
      if (aiDetection) { try { renderAIDetectionPanel(aiDetection); } catch (e) { console.warn(e); document.getElementById('ai-detection-card').classList.add('hidden'); } }
      else document.getElementById('ai-detection-card').classList.add('hidden');
      const c2paStatus = document.getElementById('c2pa-status');
      if (c2paStatus) c2paStatus.textContent = 'C2PA : vérification non lancée.';
      switchDetectedMode(forceMode || (ai.isSub ? 'SUB' : 'PROOF'));
      document.getElementById('scan-result').classList.remove('hidden');
    } catch (fatalError) {
      console.error('SHIELDPROOF scan error', fatalError);
      toast('Analyse interrompue : ' + (fatalError.message || 'erreur inconnue') + '. Essaie une image plus petite.');
    } finally {
      prog.classList.add('hidden');
      fill.style.width = '0%';
      document.getElementById('home-hud').classList.remove('hidden');
    }
  }

  function downloadIcsAlarm(name, dateStr, priceText) {
    const dt = new Date(dateStr + 'T09:00:00');
    dt.setDate(dt.getDate() - 2);
    const pad = (n) => String(n).padStart(2, '0');
    const stamp = `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T090000`;
    const ics = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SHIELDPROOF//EN','BEGIN:VEVENT',
      `UID:sp-${Date.now()}@shieldproof`,`DTSTART:${stamp}`,`SUMMARY:CANCEL ${name} (${priceText})`,
      `DESCRIPTION:ShieldProof Alert: Cancel ${name} before charge on ${dateStr}.`,
      'BEGIN:VALARM','TRIGGER:-PT0M','ACTION:DISPLAY','DESCRIPTION:Cancel subscription now!','END:VALARM',
      'END:VEVENT','END:VCALENDAR'
    ].join('\r\n');
    const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    const a = document.createElement('a'); a.href = url;
    a.download = `cancel_${name.replace(/[^a-z0-9]/gi,'_')}.ics`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  async function buildCertificateCanvas(p) {
    const dt = p.localTime || formatLocalDateTime(new Date(p.timestamp));
    const canvas = document.createElement('canvas');
    canvas.width = 1240; canvas.height = 1754;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#070b1a'; ctx.fillRect(0, 0, canvas.width, 210);
    if (p.b2bLogo) {
      await new Promise((res) => {
        const logoImg = new Image();
        logoImg.onload = () => {
          ctx.fillStyle = '#ffffff'; ctx.fillRect(55, 35, 140, 140);
          const ratio = Math.min(128 / logoImg.width, 128 / logoImg.height);
          const lw = logoImg.width * ratio, lh = logoImg.height * ratio;
          ctx.drawImage(logoImg, 55 + (140 - lw) / 2, 35 + (140 - lh) / 2, lw, lh);
          res();
        };
        logoImg.onerror = res;
        logoImg.src = p.b2bLogo;
      });
    }
    const txX = p.b2bLogo ? 225 : 60;
    ctx.fillStyle = '#22d3ee'; ctx.font = 'bold 42px sans-serif';
    ctx.fillText(p.company ? `${String(p.company).toUpperCase().slice(0,26)}` : `SHIELDPROOF v${APP_VERSION}`, txX, 82);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 28px sans-serif';
    ctx.fillText('CERTIFICAT D’INTÉGRITÉ / INTEGRITY CERTIFICATE', txX, 134);
    ctx.fillStyle = '#34d399'; ctx.font = 'bold 24px monospace';
    ctx.fillText(`ID: ${p.certId} • ${p.cat}`, txX, 180);

    const verifyUrl = getVerifyUrlForProof(p);
    if (typeof qrcode !== 'undefined') {
      try {
        const qr = qrcode(0, 'M');
        qr.addData(verifyUrl); qr.make();
        const count = qr.getModuleCount();
        const qrSize = 230;
        const qx = canvas.width - qrSize - 55, qy = 235;
        ctx.fillStyle = '#ffffff'; ctx.fillRect(qx - 10, qy - 10, qrSize + 20, qrSize + 52);
        ctx.strokeStyle = '#0ea5e9'; ctx.lineWidth = 3; ctx.strokeRect(qx - 10, qy - 10, qrSize + 20, qrSize + 52);
        const cell = qrSize / count;
        ctx.fillStyle = '#0f172a';
        for (let r = 0; r < count; r++) {
          for (let c = 0; c < count; c++) {
            if (qr.isDark(r, c)) ctx.fillRect(qx + c * cell, qy + r * cell, Math.ceil(cell), Math.ceil(cell));
          }
        }
        ctx.fillStyle = '#0369a1'; ctx.font = 'bold 17px sans-serif';
        ctx.fillText('SCANNER POUR VÉRIFIER (/verify)', qx - 6, qy + qrSize + 28);
      } catch (_) {}
    }

    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 28px sans-serif'; ctx.fillText(`Date & Heure : ${dt}`, 60, 268);
    ctx.fillStyle = '#334155'; ctx.font = '22px sans-serif';
    let y = 308;
    ctx.fillText(`UTC : ${p.timestamp}`, 60, y); y += 38;
    ctx.fillText(`Objet : ${String(p.title).slice(0,44)}`, 60, y); y += 38;
    if (p.ref) { ctx.fillText(`Réf / Plaque / Bien : ${String(p.ref).slice(0,42)}`, 60, y); y += 38; }
    if (p.notes) { ctx.fillText(`Observations : ${String(p.notes).slice(0,48)}`, 60, y); y += 38; }
    ctx.fillText(`Original : ${String(p.fileName).slice(0,38)} (${p.fileSize} bytes)`, 60, y);

    // Bloc SHA-256
    ctx.fillStyle = '#f1f5f9'; ctx.fillRect(60, 520, canvas.width - 120, 145);
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2; ctx.strokeRect(60, 520, canvas.width - 120, 145);
    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 22px sans-serif';
    ctx.fillText('EMPREINTE SHA-256 — IDENTIFIANT DU FICHIER SCELLÉ :', 84, 560);
    ctx.fillStyle = '#0369a1'; ctx.font = 'bold 26px monospace';
    ctx.fillText(p.hash.slice(0,32), 84, 604); ctx.fillText(p.hash.slice(32), 84, 644);

    // Bloc analyse IA
    if (p.aiScore > 0) {
      const aiPct = Math.round(p.aiScore * 100);
      ctx.fillStyle = p.aiScore >= 0.6 ? '#fef2f2' : (p.aiScore >= 0.35 ? '#fffbeb' : '#f0fdf4');
      ctx.fillRect(60, 680, canvas.width - 120, 60);
      ctx.strokeStyle = p.aiScore >= 0.6 ? '#dc2626' : (p.aiScore >= 0.35 ? '#d97706' : '#16a34a');
      ctx.lineWidth = 2; ctx.strokeRect(60, 680, canvas.width - 120, 60);
      ctx.fillStyle = p.aiScore >= 0.6 ? '#991b1b' : (p.aiScore >= 0.35 ? '#92400e' : '#166534');
      ctx.font = 'bold 20px sans-serif';
      const aiLabel = p.aiScore >= 0.6 ? '⚠️ ANALYSE IA : FORTE SUSPICION' :
                      (p.aiScore >= 0.35 ? '⚠️ ANALYSE IA : SUSPICION MODÉRÉE' : '✓ ANALYSE IA : IMAGE SEMBLE AUTHENTIQUE');
      ctx.fillText(`${aiLabel} — Score ${aiPct}%`, 84, 718);
    }

    if (p.thumb) {
      await new Promise((res) => {
        const img = new Image();
        img.onload = () => {
          const maxW = canvas.width - 120, maxH = 780;
          const ratio = Math.min(maxW / img.width, maxH / img.height);
          const w = img.width * ratio, h = img.height * ratio;
          const x = (canvas.width - w) / 2, yImg = 765;
          ctx.drawImage(img, x, yImg, w, h);
          ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3; ctx.strokeRect(x, yImg, w, h);
          res();
        };
        img.onerror = res;
        img.src = p.thumb;
      });
    }

    ctx.fillStyle = '#0f172a'; ctx.fillRect(60, 1585, canvas.width - 120, 118);

  async function shareProofPdf(id) {
    const p = proofsCache.find((x) => x.id === id);
    if (!p) return;
    if (!window.jspdf || !window.jspdf.jsPDF) { printCertificatePdf(id); return; }
    const canvas = await buildCertificateCanvas(p);
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    doc.addImage(imgData, 'JPEG', 0, 0, 210, 297);
    const pdfBlob = doc.output('blob');
    const pdfFile = new File([pdfBlob], `${p.certId}.pdf`, { type: 'application/pdf' });
    const text = buildProofShareText(p);
    if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
      try { await navigator.share({ title: `${p.certId}.pdf`, text, files: [pdfFile] }); return; }
      catch (err) { if (err && err.name === 'AbortError') return; }
    }
    doc.save(`${p.certId}.pdf`);
  }

    const p = proofsCache.find((x) => x.id === id);

      if (!blob) return;
      const file = new File([blob], `${p.certId}_proof.png`, { type: 'image/png' });
      const text = buildProofShareText(p);
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ title: p.certId, text, files: [file] }); return; }
        catch (err) { if (err && err.name === 'AbortError') return; }

  function onVerifyHashInput() {
    const val = document.getElementById('pub-verify-hash').value.trim();

  }

  async function searchByHashOrId(silent) {
    const q = document.getElementById('pub-verify-hash').value.trim().toLowerCase();
    const box = document.getElementById('verify-result');
    if (!q) { if (!silent) box.classList.add('hidden'); return; }

    if (lastVerifyFileHash && /^[a-f0-9]{64}$/.test(q)) {
      await compareVerifyHashes(lastVerifyFileHash);
      return;
    }

    const list = await dbAll('proofs');
    const match = list.find((p) => p.hash.toLowerCase() === q || p.certId.toLowerCase() === q || (q.length >= 8 && p.hash.toLowerCase().startsWith(q)));
    box.classList.remove('hidden');
    if (match) {
      lastCreatedProofId = match.id;
      renderProofs();
      box.innerHTML = `<div class="badge badge-ok" style="display:block;padding:12px;">✅ Trouvé dans votre coffre local : <strong>${esc(match.title)}</strong> (${esc(match.certId)})<br><small>${esc(match.localTime || match.timestamp)} — Choisissez maintenant le fichier photo original ci-dessous pour vérifier l'image.</small></div>`;
    } else if (/^[a-f0-9]{64}$/.test(q)) {
      box.innerHTML = `<div class="badge badge-warn" style="display:block;padding:12px;">🔎 Empreinte prête (${esc(q.slice(0,16))}...). Absente du coffre local de cet appareil : appuyez sur <strong>« Choisir la photo originale à vérifier »</strong> pour la comparer.</div>`;
    } else if (!silent) {
      box.innerHTML = `<div class="badge badge-err" style="display:block;padding:12px;">❌ Aucune preuve locale trouvée pour « ${esc(q)} ». Collez les 64 caractères du SHA-256 puis choisissez la photo.</div>`;
    }
  }

  async function compareVerifyHashes(hash) {
    const t = I18N[lang];
    const q = document.getElementById('pub-verify-hash').value.trim().toLowerCase();
    const box = document.getElementById('verify-result');
    box.classList.remove('hidden');

    let expectedHash = /^[a-f0-9]{64}$/.test(q) ? q : '';
    const list = await dbAll('proofs');
    if (!expectedHash && q) {
      const byId = list.find((p) => p.certId.toLowerCase() === q);
      if (byId) expectedHash = byId.hash.toLowerCase();
    }

    if (expectedHash) {
      const ok = expectedHash === hash.toLowerCase();
      box.innerHTML = ok
        ? `<div class="badge badge-ok" style="display:block;padding:12px;">${esc(t.authOk)}<br><small style="font-family:monospace;">SHA-256: ${esc(hash)}</small></div>`
        : `<div class="badge badge-err" style="display:block;padding:12px;">${esc(t.authFail)}<br><small style="font-family:monospace;">Fichier: ${esc(hash.slice(0,22))}... ≠ Certificat: ${esc(expectedHash.slice(0,22))}...</small></div>`;
      return;
    }

    const match = list.find((p) => p.hash === hash);
    box.innerHTML = match
      ? `<div class="badge badge-ok" style="display:block;padding:12px;">${esc(t.authOk)}<br><small>${esc(match.certId)} • ${esc(match.localTime || match.timestamp)}</small></div>`
      : `<div class="badge badge-err" style="display:block;padding:12px;">${esc(t.authFail)}</div>`;
  }

  async function verifyPhotoFile(event) {

    lastVerifyFileHash = await sha256Hex(await file.arrayBuffer());
    await compareVerifyHashes(lastVerifyFileHash);
    event.target.value = '';
  }

  async function verifyKeyWithProduct(productId, key, increment) {
    if (!productId || productId.startsWith('REPLACE_') || !GUMROAD_CONFIG.verifyProxyUrl) return { ok: false };
    try {
      const res = await fetch(GUMROAD_CONFIG.verifyProxyUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ product_id: productId, license_key: key, increment_uses_count: increment ? 'true' : 'false' })
      });
      const data = await res.json();
      const p = data.purchase || {};
      const active = Boolean(data.success) && !p.refunded && !p.chargebacked && !p.disputed && !p.subscription_cancelled_at;
      return { ok: active, uses: data.uses || 1 };
    } catch (_) { return { ok: false }; }
  }

  async function activateGumroadKey() {
    const t = I18N[lang];
    const key = document.getElementById('in-license-key').value.trim();
    if (!key) return;
    if (!GUMROAD_CONFIG.verifyProxyUrl) { toast(t.checkoutNotReady); return; }
    const lic = saveLicenseState({});
    if (lic.activatedKeys.includes(key)) { toast(t.keyAlreadyUsed); return; }
    const btn = document.getElementById('btn-activate-key');
    btn.disabled = true;

    const b2bFleetCheck = await verifyKeyWithProduct(GUMROAD_CONFIG.b2bFleetProductId, key, true);
    if (b2bFleetCheck.ok && b2bFleetCheck.uses <= 20) {
      saveLicenseState({ proUnlimited: true, b2bPro: true, b2bSeats: 20, activatedKeys: [...lic.activatedKeys, key] });
      btn.disabled = false; closeProModal(); refreshB2bUi(); renderHomeHud(); toast(t.keySuccessB2b); return;
    }
    const b2bStarterCheck = await verifyKeyWithProduct(GUMROAD_CONFIG.b2bStarterProductId, key, true);
    if (b2bStarterCheck.ok && b2bStarterCheck.uses <= 5) {
      saveLicenseState({ proUnlimited: true, b2bPro: true, b2bSeats: 5, activatedKeys: [...lic.activatedKeys, key] });
      btn.disabled = false; closeProModal(); refreshB2bUi(); renderHomeHud(); toast(t.keySuccessB2b); return;
    }
    const proCheck = await verifyKeyWithProduct(GUMROAD_CONFIG.proProductId, key, false);
    if (proCheck.ok) {
      saveLicenseState({ proUnlimited: true, activatedKeys: [...lic.activatedKeys, key] });
      btn.disabled = false; closeProModal(); renderHomeHud(); toast(t.keySuccessPro); return;
    }
    const packCheck = await verifyKeyWithProduct(GUMROAD_CONFIG.pack10ProductId, key, true);
    btn.disabled = false;
    if (packCheck.ok && packCheck.uses <= 2) {
      saveLicenseState({ credits: (lic.credits || 0) + 10, activatedKeys: [...lic.activatedKeys, key] });
      closeProModal(); renderHomeHud(); toast(t.keySuccessPack); return;
    }
    toast(t.keyInvalid);
  }

  function handleStartupRoute() {
    const params = new URLSearchParams(window.location.search);
    const isVerifyPath = window.location.pathname.endsWith('/verify') || window.location.hash === '#verify' || params.get('verify') === '1';
    if (isVerifyPath) {
      const qrHash = params.get('hash') || '';
      const qrCert = params.get('cert') || '';
      const qrUtc = params.get('utc') || '';
      const qrTitle = params.get('title') || '';
      if (qrHash) document.getElementById('pub-verify-hash').value = qrHash;
      if (qrCert || qrHash) {
        const meta = document.getElementById('qr-cert-meta');
        meta.classList.remove('hidden');
        meta.innerHTML = `<strong>📜 Certificat scanné :</strong> ${esc(qrCert)} ${qrTitle ? '— ' + esc(qrTitle) : ''}<br><span class="muted">UTC : ${esc(qrUtc)}</span>`;
      }
      switchTab('proofs', 2);
    } else {
      showLanding();
    }
  }
